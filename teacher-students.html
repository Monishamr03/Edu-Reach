<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Students | EduReach</title><link rel="stylesheet" href="style.css?v=12">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fc;color:#172554;font-family:Arial,sans-serif}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 5%;background:#fff;border-bottom:1px solid #e5e7eb}main{max-width:1100px;margin:32px auto;padding:0 20px 50px}.btn{display:inline-block;border:0;border-radius:8px;padding:11px 15px;background:#6558f5;color:white;text-decoration:none;font-weight:bold;cursor:pointer}.secondary{background:#e5e7eb;color:#172554}.panel{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:20px;margin:18px 0;overflow-x:auto}.notice{padding:14px;border-radius:8px;background:#eef2ff;margin:18px 0;white-space:pre-wrap}.error{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}.muted{color:#64748b}table{width:100%;border-collapse:collapse;min-width:520px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e5e7eb}th{background:#f8fafc}input{padding:11px;width:100%;max-width:420px;border:1px solid #cbd5e1;border-radius:8px}
</style></head>
<body>
<header><strong>EduReach · Students</strong><div><a class="btn secondary" href="teacher-dashboard.html">← Dashboard</a> <button id="logout" class="btn secondary">Log out</button></div></header>
<main><h1>Students</h1><p class="muted">View student accounts registered in EduReach.</p><div id="notice" class="notice">Checking your teacher account…</div><section id="content" hidden><div class="panel"><label for="search"><strong>Search students</strong></label><p><input id="search" placeholder="Search by name or email"></p><p id="count" class="muted">Loading students…</p><table><thead><tr><th>Name</th><th>Email</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table><p id="empty" hidden>No student accounts were found.</p></div></section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase.js"></script>
<script>
document.addEventListener('DOMContentLoaded',async()=>{const notice=document.getElementById('notice'),content=document.getElementById('content'),rows=document.getElementById('rows'),count=document.getElementById('count'),empty=document.getElementById('empty');let students=[];const msg=(s,err=false)=>{notice.textContent=s;notice.className='notice'+(err?' error':'');notice.hidden=false};function render(){const q=document.getElementById('search').value.trim().toLowerCase();const list=students.filter(s=>(String(s.name||'').toLowerCase()+' '+String(s.email||'').toLowerCase()).includes(q));rows.innerHTML='';list.forEach(s=>{const tr=document.createElement('tr');[s.name||'Student',s.email||'Not provided',s.status||s.approvalStatus||'Registered'].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});rows.appendChild(tr)});count.textContent=list.length+' student'+(list.length===1?'':'s')+(q?' matching your search':'');empty.hidden=list.length!==0}
try{const user=await new Promise(resolve=>eduReachAuth.onAuthStateChanged(resolve));if(!user){location.replace('login.html?role=teacher');return}const profileSnap=await eduReachDB.collection('users').doc(user.uid).get();if(!profileSnap.exists){msg('Your EduReach profile was not found.',true);return}const p=profileSnap.data();if(p.role!=='teacher'||p.status!=='approved'||p.approvalStatus!=='approved'){msg('Only approved teacher accounts can view this page.',true);return}content.hidden=false;msg('Teacher verified. Student list loaded from registered user profiles.');const snap=await eduReachDB.collection('users').get();students=snap.docs.map(d=>d.data()).filter(x=>x.role==='student');render();document.getElementById('search').addEventListener('input',render)}catch(e){console.error(e);msg('Could not load students: '+(e.code||e.message)+'\nCheck that your Firestore rules allow approved teachers to read student profiles.',true)}document.getElementById('logout').addEventListener('click',async()=>{await eduReachAuth.signOut();location.replace('login.html?role=teacher')})});
</script></body></html>
