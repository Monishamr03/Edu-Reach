<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Registration | EduReach</title>
    <link rel="stylesheet" href="style.css?v=8">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">

            <a href="index.html" class="back-link">
                ← Back to EduReach
            </a>

            <div class="auth-header">
                <div class="auth-logo">📚</div>
                <h1>Create Teacher Account</h1>
                <p>Join EduReach as an educator.</p>
            </div>

            <div class="account-type">
                <div class="account-type-icon">👩‍🏫</div>
                <div>
                    <span>ACCOUNT TYPE</span>
                    <strong>Teacher</strong>
                </div>
            </div>

            <div class="auth-notice">
                <strong>Approval required</strong>
                <p>
                    Your account will remain pending until an administrator
                    approves your registration.
                </p>
            </div>

            <div id="registerMessage"
                 class="auth-message"
                 role="status"
                 aria-live="polite"
                 hidden>
            </div>

            <form id="teacherRegisterForm">

                <div class="form-group">
                    <label for="teacherName">Full Name</label>
                    <input
                        type="text"
                        id="teacherName"
                        name="teacherName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="teacherEmail">Email Address</label>
                    <input
                        type="email"
                        id="teacherEmail"
                        name="teacherEmail"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="schoolName">School Name (Optional)</label>
                    <input
                        type="text"
                        id="schoolName"
                        name="schoolName"
                        placeholder="Enter your school name"
                        autocomplete="organization"
                    >
                </div>

                <div class="form-group">
                    <label for="teacherPassword">Password</label>
                    <input
                        type="password"
                        id="teacherPassword"
                        name="teacherPassword"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                    <small>Use at least 8 characters.</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Enter your password again"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <button type="submit" id="teacherRegisterButton">
                    Create Teacher Account
                </button>

            </form>

            <p class="auth-footer">
                Already registered?
                <a href="login.html?role=teacher">Teacher Login</a>
            </p>

        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script src="firebase.js"></script>
    <script src="teacher-register.js?v=1"></script>

</body>
</html>
